
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WIN333 Rewards</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 25px;
      background: #101d32;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      background: #1b2e49;
      padding: 25px;
      border-radius: 18px;
      margin-top: 40px;
    }
    button {
      width: 100%;
      padding: 16px;
      background: #2498ed;
      border: 0;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
    }
    #status { color: #8ce5a8; }
  </style>
</head>
<body>
  <div class="card">
    <h1>WIN333 REWARDS</h1>
    <h2>Welcome!</h2>
    <p id="name">Loading Telegram account...</p>
    <p id="username"></p>
    <p id="status">Phone verification required</p>
    <button id="share">SHARE MY PHONE NUMBER</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {
      document.getElementById("name").textContent =
        "Name: " + user.first_name;
      document.getElementById("username").textContent =
        user.username ? "@" + user.username : "No username";
    } else {
      document.getElementById("name").textContent =
        "Please open this app through Telegram.";
    }

    document.getElementById("share").onclick = function() {
      if (!user) {
        tg.showAlert("Open this Mini App through Telegram first.");
        return;
      }
      tg.requestContact(function(shared) {
        if (shared) {
          document.getElementById("status").textContent =
            "Contact shared. Server verification is still required.";
          tg.showAlert("Contact received. Please wait for secure verification.");
        } else {
          tg.showAlert("Phone number sharing is required.");
        }
      });
    };
  </script>
</body>
</html>
